name: Health Code

# This repository's caller for its own Dependabot pull requests. It is the caller from the CI guide with a local path.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  dependency-pull-requests:
    if: >-
      vars.HEALTH_CODE_DEPENDENCY_PULL_REQUESTS != 'off' &&
      (github.event_name != 'workflow_run' ||
      contains(fromJSON('["failure", "timed_out"]'), github.event.workflow_run.conclusion))
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      checks: read
      attestations: read
    uses: ./.github/workflows/dependency-pull-requests.yml
    with:
      model-host: https://api.anthropic.com
      model: claude-opus-5-5
    secrets:
      RUNTA_TOKEN: ${{ secrets.RUNTA_TOKEN }}
