name: Stage Health Code packages
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: npm-release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git merge-base --is-ancestor HEAD origin/main
      - uses: ./.github/actions/setup-bun
      - run: bash scripts/preflight.sh

  # build and test the standalone executable on each platform it ships for
  build-executable:
    if: github.event_name == 'push'
    needs: verify
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-latest
            platform: darwin-arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: bun run test:executable
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: executable-${{ matrix.platform }}
          path: apps/cli/build/health-code-*-${{ matrix.platform }}
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.platform }}
          path: apps/cli/build/health-code-*-${{ matrix.platform }}.files.json
          if-no-files-found: error

  # attest the executables and publish them on the release. this is the only job that can write to the repository
  publish-executables:
    if: github.event_name == 'push'
    needs: build-executable
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: release
      - id: release
        name: Require identical package files and look for an earlier publication
        working-directory: release
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # require all three executables and identical package file digests
          for platform in linux-x64 linux-arm64 darwin-arm64; do
            test -s "health-code-$version-$platform"
            jq -S .files "health-code-$version-$platform.files.json" > "$RUNNER_TEMP/$platform.json"
            cmp "$RUNNER_TEMP/$platform.json" "$RUNNER_TEMP/linux-x64.json"
          done

          # skip the upload when an earlier run already published this version's checksum file. the tag lookup returns published releases only
          assets=""
          if ! release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" 2> "$RUNNER_TEMP/release-error"); then
            grep -q "HTTP 404" "$RUNNER_TEMP/release-error" || { cat "$RUNNER_TEMP/release-error" >&2; exit 1; }
          else
            assets=$(jq -r '.assets[].name' <<< "$release_json")
          fi
          if grep -qx "health-code-$version.sha256" <<< "$assets"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify the executables an earlier run published
        if: steps.release.outputs.published == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir published && cd published
          gh release download "$GITHUB_REF_NAME" --pattern "health-code-$VERSION-*" --pattern "health-code-$VERSION.sha256"
          sha256sum --check "health-code-$VERSION.sha256"
          for platform in linux-x64 linux-arm64 darwin-arm64; do
            gh attestation verify "health-code-$VERSION-$platform" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          done
      - name: Write the checksum file
        if: steps.release.outputs.published != 'true'
        working-directory: release
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          sha256sum "health-code-$VERSION-linux-x64" "health-code-$VERSION-linux-arm64" "health-code-$VERSION-darwin-arm64" \
            > "health-code-$VERSION.sha256"
      - id: attest
        if: steps.release.outputs.published != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/health-code-${{ steps.release.outputs.version }}.sha256
      - name: Publish the executables on the release
        if: steps.release.outputs.published != 'true'
        working-directory: release
        env:
          VERSION: ${{ steps.release.outputs.version }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE_PATH" "health-code-$VERSION.sigstore.json"

          # create a draft so every file is in place before the release becomes public
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            notes="Standalone executables for Linux x64, Linux arm64 and macOS arm64. Verify them with the commands in the [CI guide](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/apps/cli/README.md#verify-a-download). The npm package publishes after maintainer approval."
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes "$notes"
          fi
          gh release upload "$GITHUB_REF_NAME" --clobber \
            "health-code-$VERSION-linux-x64" "health-code-$VERSION-linux-arm64" "health-code-$VERSION-darwin-arm64" \
            "health-code-$VERSION.sha256" "health-code-$VERSION.sigstore.json"
          gh release edit "$GITHUB_REF_NAME" --draft=false

  stage:
    if: github.event_name == 'push'
    needs: publish-executables
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          merge-multiple: true
          path: ${{ runner.temp }}/executable-files
      - run: npm install --global --ignore-scripts npm@11.20.0
      - run: bash scripts/release-packages.sh --stage
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          EXECUTABLE_FILES: ${{ runner.temp }}/executable-files

  verify-public:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify the published Linux x64 executable as a user would
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p "$RUNNER_TEMP/published" "$RUNNER_TEMP/executable-files" && cd "$RUNNER_TEMP/published"
          gh release download "$GITHUB_REF_NAME" --pattern "health-code-$version-linux-x64" --pattern "health-code-$version.sha256"
          sha256sum --check --ignore-missing "health-code-$version.sha256"
          gh attestation verify "health-code-$version-linux-x64" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          chmod +x "health-code-$version-linux-x64"
          "./health-code-$version-linux-x64" --version --json > "$RUNNER_TEMP/executable-files/linux-x64.files.json"
      - run: npm install --global --ignore-scripts npm@11.20.0
      - run: bash scripts/release-packages.sh --verify-public
        env:
          EXECUTABLE_FILES: ${{ runner.temp }}/executable-files
